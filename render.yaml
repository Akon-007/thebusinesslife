services:
  - type: web
    name: businesslife-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: businesslife-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/businesslife.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO_ACCOUNTS
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LECTURER_PASSWORD
        sync: false
